name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /hiraku
          VITE_API_BASE: https://hiraku-api.yoopix.com.br

      # O adapter usa fallback index.html (o APK precisa dele). O Pages so
      # cai no fallback se existir 404.html; sem ele, abrir /hiraku/catalog
      # direto ou dar refresh em qualquer rota dava o 404 do GitHub.
      - run: cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
